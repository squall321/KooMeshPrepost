name: CI

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release

jobs:
  # Ubuntu 빌드 및 테스트
  build-ubuntu:
    name: Ubuntu ${{ matrix.ubuntu-version }} - ${{ matrix.compiler }}
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [22.04, 24.04]
        compiler: [gcc-11, gcc-12, clang-14, clang-15]
        include:
          - compiler: gcc-11
            cc: gcc-11
            cxx: g++-11
          - compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - compiler: clang-14
            cc: clang-14
            cxx: clang++-14
          - compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libeigen3-dev \
          ${{ matrix.cxx }}

    - name: Install optional dependencies
      continue-on-error: true
      run: |
        sudo apt-get install -y \
          qt6-base-dev \
          libvtk9-dev \
          libtbb-dev \
          libboost-all-dev

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}

    - name: Upload build artifacts
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: build-logs-${{ matrix.ubuntu-version }}-${{ matrix.compiler }}
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log

  # macOS 빌드 및 테스트
  build-macos:
    name: macOS - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ninja eigen

    - name: Install optional dependencies
      continue-on-error: true
      run: |
        brew install qt6 vtk tbb boost

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}

  # Windows 빌드 및 테스트
  build-windows:
    name: Windows - ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'

    - name: Install dependencies via vcpkg
      run: |
        vcpkg install eigen3:${{ matrix.arch }}-windows

    - name: Install optional dependencies
      continue-on-error: true
      run: |
        vcpkg install qt6:${{ matrix.arch }}-windows
        vcpkg install vtk:${{ matrix.arch }}-windows
        vcpkg install tbb:${{ matrix.arch }}-windows
        vcpkg install boost:${{ matrix.arch }}-windows

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DBUILD_TESTS=ON `
          -DBUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

  # Sanitizers 빌드 (메모리 누수 검사)
  build-sanitizers:
    name: Sanitizers - ${{ matrix.sanitizer }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          clang-15 \
          libeigen3-dev

    - name: Configure CMake
      env:
        CC: clang-15
        CXX: clang++-15
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_SANITIZERS=ON \
          -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests with ${{ matrix.sanitizer }} sanitizer
      working-directory: build
      env:
        ASAN_OPTIONS: detect_leaks=1:symbolize=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:symbolize=1:abort_on_error=1
        TSAN_OPTIONS: second_deadlock_stack=1
      run: ctest --output-on-failure

  # Coverage 리포트
  coverage:
    name: Code Coverage
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          gcc-12 \
          g++-12 \
          lcov \
          libeigen3-dev

    - name: Configure CMake
      env:
        CC: gcc-12
        CXX: g++-12
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
          -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure

    - name: Generate coverage report
      run: |
        lcov --capture --directory build --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.info
        fail_ci_if_error: false

  # 빌드 성공 확인 (모든 jobs 완료)
  ci-success:
    name: CI Success
    needs: [build-ubuntu, build-macos, build-windows, build-sanitizers, coverage]
    runs-on: ubuntu-latest
    steps:
    - name: Mark CI as successful
      run: echo "All CI jobs passed successfully!"
